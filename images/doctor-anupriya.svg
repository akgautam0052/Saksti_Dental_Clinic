<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%">
  <defs>
    <linearGradient id="docGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="320" height="360" rx="20" fill="url(#docGrad1)"/>
  
  <!-- Subtle background medical decorative circles -->
  <circle cx="160" cy="150" r="110" fill="#DDD6FE" opacity="0.4"/>
  <circle cx="260" cy="70" r="30" fill="#CCFBF1" opacity="0.6"/>
  <circle cx="60" cy="270" r="40" fill="#EDE9FE" opacity="0.8"/>

  <!-- Doctor Silhouette / Illustration -->
  <g transform="translate(60, 40)">
    <!-- Shoulders / Coat -->
    <path d="M10 260 C10 200 45 180 100 180 C155 180 190 200 190 260 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M65 180 L100 240 L135 180 Z" fill="#8B5CF6" opacity="0.15"/>
    <!-- Collar & Tie/Scarf -->
    <path d="M80 180 L100 220 L120 180 Z" fill="#0D9488"/>
    <path d="M50 180 L75 250" stroke="#7C3AED" stroke-width="3" fill="none"/>
    <path d="M150 180 L125 250" stroke="#7C3AED" stroke-width="3" fill="none"/>
    <!-- Stethoscope -->
    <path d="M70 195 C70 240 130 240 130 195" stroke="#475569" stroke-width="4" fill="none"/>
    <circle cx="100" cy="245" r="8" fill="#0D9488"/>

    <!-- Neck & Face -->
    <rect x="86" y="145" width="28" height="40" rx="8" fill="#FBD38D"/>
    <!-- Face -->
    <ellipse cx="100" cy="120" rx="42" ry="50" fill="#FBD38D"/>
    <!-- Hair (professional dark brown/black styled hair) -->
    <path d="M58 115 C54 70 75 50 100 50 C125 50 146 70 142 115 C135 90 120 75 100 75 C80 75 65 90 58 115 Z" fill="#292524"/>
    <path d="M55 110 C50 140 60 170 65 180 C60 150 62 120 62 105 Z" fill="#292524"/>
    <path d="M145 110 C150 140 140 170 135 180 C140 150 138 120 138 105 Z" fill="#292524"/>
    
    <!-- Warm Smiling Face Details -->
    <circle cx="85" cy="115" r="4" fill="#44403C"/>
    <circle cx="115" cy="115" r="4" fill="#44403C"/>
    <!-- Gentle eyebrows -->
    <path d="M78 107 Q86 102 93 107" stroke="#44403C" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M107 107 Q114 102 122 107" stroke="#44403C" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Nose -->
    <path d="M100 115 L98 126 L104 126" stroke="#E29578" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Warm smile -->
    <path d="M88 138 Q100 152 112 138" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" fill="#FFFFFF"/>
    
    <!-- Doctor Badge Pin -->
    <circle cx="145" cy="210" r="12" fill="#7C3AED"/>
    <text x="145" y="215" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">★</text>
  </g>
  
  <!-- Founder Badge banner at bottom -->
  <g transform="translate(40, 310)">
    <rect width="240" height="36" rx="18" fill="#7C3AED"/>
    <text x="120" y="23" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Chief Dental Surgeon &amp; Founder</text>
  </g>
</svg>

