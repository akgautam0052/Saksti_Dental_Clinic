<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" aria-label="Sakthi Dental Clinic Logo">
  <defs>
    <linearGradient id="purpleHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <!-- Heart Emblem with Tooth Silhouette -->
  <g transform="translate(4, 6)">
    <path d="M24 45.2 C12 36 2 27 2 17.5 C2 9.5 8.2 3.5 16.2 3.5 C20.6 3.5 24 5.8 26 9.4 C28 5.8 31.4 3.5 35.8 3.5 C43.8 3.5 50 9.5 50 17.5 C50 27 40 36 28 45.2 L26 46.8 Z" 
          fill="url(#purpleHeartGrad)" />
    <!-- White Tooth overlay inside heart -->
    <path d="M26 12 C21 12 18 15 18 19 C18 24 20 28 21 34 C21.5 37 23.5 37.5 24.5 34 C25.2 31.5 25.5 29 26 29 C26.5 29 26.8 31.5 27.5 34 C28.5 37.5 30.5 37 31 34 C32 28 34 24 34 19 C34 15 31 12 26 12 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    <!-- Teal gentle sparkle spark -->
    <path d="M43 7 L44.5 12 L49.5 13.5 L44.5 15 L43 20 L41.5 15 L36.5 13.5 L41.5 12 Z" fill="url(#tealGrad)"/>
  </g>
  
  <!-- Text Brand -->
  <text x="64" y="27" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" fill="currentColor" class="logo-text-primary">SAKTHI</text>
  <text x="64" y="44" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5" fill="#0D9488" class="logo-text-accent">DENTAL CLINIC</text>
  <text x="64" y="55" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="8.5" letter-spacing="0.8" fill="currentColor" opacity="0.6">HOSUR • EST. 2004</text>
</svg>

