<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sterilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sterilGrad)"/>
  <polygon points="0,300 600,300 600,400 0,400" fill="#94A3B8" opacity="0.3"/>

  <!-- Autoclave / Sterilization Unit Counters -->
  <rect x="80" y="200" width="440" height="130" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="120" y="100" width="160" height="110" rx="12" fill="#334155"/>
  <circle cx="200" cy="155" r="40" fill="#64748B"/>
  <circle cx="200" cy="155" r="32" fill="#1E293B"/>
  <circle cx="200" cy="155" r="12" fill="#2DD4BF"/>
  <rect x="250" y="120" width="18" height="10" rx="2" fill="#10B981"/>

  <!-- UV Sterilization Cabinet -->
  <rect x="320" y="100" width="160" height="110" rx="8" fill="#475569"/>
  <rect x="335" y="115" width="130" height="80" rx="6" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/>
  <text x="400" y="160" font-family="'Inter', sans-serif" font-size="24" fill="#A7F3D0" text-anchor="middle">⚡ UV</text>

  <!-- Clean certification stamp icon -->
  <g transform="translate(480, 50)">
    <circle cx="30" cy="30" r="28" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <text x="30" y="36" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🛡️</text>
  </g>

  <text x="30" y="40" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#334155">Multi-Stage Sterilization Room</text>
  <text x="30" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Class-B autoclave, ultrasonic cleaning, and 100% sterile packaged pouches</text>
</svg>

